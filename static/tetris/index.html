<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>MQTT Tetris — Pick a seat</title>
    <link rel="stylesheet" href="/tetris/tetris.css" />
    <link rel="stylesheet" href="/arcade-room-pick.css" />
    <style>
      :root {
        --accent: #7af0ff;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>CO‑OP TETRIS</h1>
      <p>Open two windows: one for Man (spawn right) and one for Boy (spawn left). Broker: <code>wss://broker.hivemq.com:8884/mqtt (fallbacks if busy)</code></p>
      <div id="arcadeRoomPick"></div>
      <p><a class="a" href="/tetris/man.html">MAN</a> <a class="b" href="/tetris/boy.html">BOY</a></p>
      <p class="back"><a href="/">← Arcade dashboard</a></p>
    </div>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <link rel="stylesheet" href="/arcade-mqtt.css" />
    <script src="/arcade-mqtt.js"></script>
    <script src="/arcade-connect.js"></script>
    <script src="/arcade-room-pick.js"></script>
    <script>
      window.ArcadeRoom &&
        window.ArcadeRoom.mount({
          rootId: 'arcadeRoomPick',
          gameKey: 'tetris',
          manPath: '/tetris/man.html',
          boyPath: '/tetris/boy.html',
        });
    </script>
  </body>
</html>
