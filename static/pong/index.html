<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>MQTT Pong — Pick a seat</title>
    <link rel="stylesheet" href="/pong/pong.css" />
    <link rel="stylesheet" href="/arcade-room-pick.css" />
    <style>
      :root {
        --accent: #7af0ff;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        overflow: auto;
      }
      .card {
        max-width: 520px;
        text-align: center;
        background: linear-gradient(165deg, rgba(22, 32, 48, 0.92) 0%, rgba(12, 16, 24, 0.95) 100%);
        border: 1px solid rgba(122, 240, 255, 0.25);
        border-radius: 16px;
        padding: 28px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
      }
      .card h1 {
        font-family: 'Orbitron', sans-serif;
        font-size: 1.05rem;
        margin: 0 0 12px;
        color: #7af0ff;
        letter-spacing: 0.08em;
      }
      .card p {
        margin: 0 0 16px;
        font-size: 0.75rem;
        opacity: 0.85;
        line-height: 1.5;
      }
      .card a {
        display: inline-block;
        margin: 6px;
        padding: 12px 22px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        font-family: 'Orbitron', sans-serif;
        font-size: 0.62rem;
        letter-spacing: 0.1em;
        color: #061018;
      }
      .a {
        background: #6b8cff;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3);
      }
      .b {
        background: #ff6b8b;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3);
      }
      .back {
        margin-top: 20px;
        font-size: 0.68rem;
      }
      .back a {
        color: #9db4ff;
        margin: 0;
        padding: 0;
        background: none;
        box-shadow: none;
        font-family: inherit;
        font-weight: 400;
        letter-spacing: normal;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>MQTT PONG</h1>
      <p>
        Man runs the ball and the <strong>left</strong> paddle. Boy drives the <strong>right</strong> paddle. Controls: <strong>W/S</strong> or
        <strong>↑/↓</strong>. Broker: <code>wss://broker.hivemq.com:8884/mqtt (fallbacks if busy)</code>
      </p>
      <div id="arcadeRoomPick"></div>
      <p><a class="a" href="/pong/man.html">MAN</a> <a class="b" href="/pong/boy.html">BOY</a></p>
      <p class="back"><a href="/">← Arcade dashboard</a></p>
    </div>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <link rel="stylesheet" href="/arcade-mqtt.css" />
    <script src="/arcade-mqtt.js"></script>
    <script src="/arcade-room-pick.js"></script>
    <script>
      window.ArcadeRoom &&
        window.ArcadeRoom.mount({
          rootId: 'arcadeRoomPick',
          gameKey: 'pong',
          manPath: '/pong/man.html',
          boyPath: '/pong/boy.html',
        });
    </script>
  </body>
</html>
