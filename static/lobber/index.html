<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Emoji Lobber</title>
    <link rel="stylesheet" href="/lobber/lobber.css" />
    <style>
      :root {
        --accent: #ffc800;
      }
      html,
      body {
        overflow: auto;
        height: auto;
        min-height: 100%;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 460px;
        text-align: center;
        background: linear-gradient(165deg, rgba(22, 32, 48, 0.95) 0%, rgba(12, 16, 24, 0.98) 100%);
        border: 1px solid rgba(122, 240, 255, 0.25);
        border-radius: 16px;
        padding: 28px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
      }
      .card h1 {
        font-family: 'Orbitron', sans-serif;
        font-size: 1rem;
        margin: 0 0 12px;
        color: #ffe08a;
        letter-spacing: 0.1em;
      }
      .card p {
        margin: 0 0 16px;
        font-size: 0.72rem;
        opacity: 0.88;
        line-height: 1.5;
      }
      .card a.play {
        display: inline-block;
        margin-top: 8px;
        padding: 14px 28px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        font-family: 'Orbitron', sans-serif;
        font-size: 0.62rem;
        letter-spacing: 0.1em;
        color: #061018;
        background: #6b8cff;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3);
      }
      .back {
        margin-top: 18px;
        font-size: 0.68rem;
      }
      .back a {
        color: #9db4ff;
        margin: 0;
        padding: 0;
        background: none;
        box-shadow: none;
        font-family: inherit;
        font-weight: 400;
        letter-spacing: normal;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>EMOJI LOBBER</h1>
      <p>
        Angry-Birds-style drag for angle and power (emoji spins in flight). Human-face heroes = your shot; stacked wood,
        stone, and creature targets. <strong>15 levels</strong> (easy → huge worlds). <strong>Lava</strong> ends the shot
        on touch. No network — runs entirely in the browser.
      </p>
      <p><a class="play" href="/lobber/game.html">PLAY</a></p>
      <p class="back"><a href="/">← Arcade dashboard</a></p>
    </div>
  </body>
</html>
