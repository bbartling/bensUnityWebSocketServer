<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>MQTT Tic Tac Toe — Man</title>
    <link rel="stylesheet" href="/tictactoe/tictactoe.css" />
    <style>
      :root {
        --accent: #6b8cff;
      }
    </style>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <link rel="stylesheet" href="/arcade-mqtt.css" />
    <script src="/arcade-mqtt.js"></script>
    <script src="/arcade-room-pick.js"></script>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>MQTT TIC TAC TOE</h1>
        <div class="sub">Man · host · you play <strong>X</strong> · tap a square on your turn</div>
      </header>
      <div id="boardWrap">
        <canvas id="gameCanvas" width="360" height="360"></canvas>
      </div>
      <div id="score">MAN'S TURN (X)</div>
      <div id="ui">
        <div id="gameInfo"></div>
        <div id="brokerInfo"></div>
        <button type="button" id="statusBtn">Send ready ping</button>
        <button type="button" id="newGameBtn">New game</button>
        <div id="statusInfo"></div>
        <div id="connectionInfo"></div>
        <p class="nav-other">
          <a href="/">Dashboard</a> · <a href="/tictactoe/">Tic Tac Toe seats</a> · Open <a href="/tictactoe/boy.html">Boy</a> in another window.
        </p>
      </div>
    </div>
    <script>
      window.TTT_CONFIG = {
        role: 'host',
        localLabel: 'Man',
        remoteLabel: 'Boy',
        accentLeft: '#6b8cff',
        accentRight: '#ff6b8b',
      };
    </script>
    <script>
      window.ArcadeRoom && window.ArcadeRoom.rewritePartnerLinks('tictactoe', '/tictactoe/man.html', '/tictactoe/boy.html');
    </script>
    <script src="/tictactoe/tictactoe.js"></script>
  </body>
</html>
